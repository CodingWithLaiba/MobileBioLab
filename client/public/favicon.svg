<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" fill="#2563eb" rx="6"/>
  <g transform="translate(6, 8)">
    <!-- Microscope body -->
    <rect x="8" y="2" width="8" height="14" fill="#ffffff" rx="1"/>
    <!-- Microscope eyepiece -->
    <rect x="10" y="0" width="4" height="4" fill="#ffffff" rx="0.5"/>
    <!-- Microscope objective lenses -->
    <circle cx="12" cy="18" r="2" fill="#ffffff"/>
    <circle cx="8" cy="18" r="1.5" fill="#ffffff"/>
    <circle cx="16" cy="18" r="1.5" fill="#ffffff"/>
    <!-- Microscope stage -->
    <rect x="6" y="20" width="12" height="2" fill="#ffffff" rx="0.5"/>
    <!-- Microscope base -->
    <rect x="10" y="22" width="4" height="4" fill="#ffffff" rx="0.5"/>
  </g>
</svg>
